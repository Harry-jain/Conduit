[build-system]
requires = ["setuptools>=69.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "voicetranslate"
version = "0.1.0"
description = "Offline real-time speech translation desktop system"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Harsh Mukesh Jain" }]
dependencies = [
  "torch==2.3.1",
  "torchaudio==2.3.1",
  "faster-whisper==1.0.3",
  "ctranslate2==4.3.1",
  "transformers==4.43.3",
  "peft==0.12.0",
  "librosa==0.10.2",
  "sounddevice==0.4.7",
  "soundfile==0.12.1",
  "numpy==1.26.4",
  "scipy==1.13.1",
  "PyQt6==6.7.1",
  "pyaudio==0.2.14",
  "silero-vad==5.1.2",
  "pyworld==0.3.4",
  "resemblyzer==0.1.4",
  "noisereduce==3.0.2",
  "pynvml==11.5.0",
  "psutil==6.0.0",
  "schedule==1.2.2",
  "onnxruntime-gpu==1.18.1",
  "sentencepiece==0.2.0",
  "sacremoses==0.1.1",
  "langdetect==1.0.9",
  "pystray==0.19.5",
  "Pillow==10.4.0",
  "pywin32==306",
  "comtypes==1.4.5",
  "requests==2.32.3",
  "huggingface-hub==0.24.5",
  "omegaconf==2.3.0",
  "python-dotenv==1.0.1",
  "rich==13.7.1",
  "loguru==0.7.2",
  "typer==0.12.3",
  "nbformat==5.10.4",
  "safetensors==0.4.4",
]

[project.optional-dependencies]
dev = [
  "pytest==8.3.2",
  "pytest-asyncio==0.23.8",
  "pytest-mock==3.14.0",
  "ruff==0.5.5",
  "mypy==1.11.1",
  "coverage==7.6.0",
]

[tool.setuptools]
packages = ["src"]

[tool.setuptools.package-dir]
"" = "."

