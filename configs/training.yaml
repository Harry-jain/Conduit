lora:
  rank: 8
  alpha: 16
  target_modules: [q_proj, v_proj]
  dropout: 0.05
  bias: none

optimizer:
  type: AdamW
  learning_rate: 1.0e-4
  weight_decay: 1.0e-4
  betas: [0.9, 0.999]

scheduler:
  type: cosine
  warmup_steps: 50
  min_lr: 1.0e-6

training:
  epochs: 20
  batch_size: 4
  gradient_clip: 1.0
  mixed_precision: true

quality_gates:
  min_secs: 0.85
  max_mcd_db: 6.0
  eval_every_n_steps: 50
  checkpoint_every_n_steps: 100

idle_scheduler:
  gpu_util_threshold: 30
  cpu_util_threshold: 40
  gpu_temp_threshold: 80
  idle_timeout_minutes: 5
  check_interval_seconds: 30
